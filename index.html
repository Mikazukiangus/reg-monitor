<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF3EF" />
    <script>
      // Apply the saved or device theme before the page draws
      (function () {
        var choice = null;
        try { choice = localStorage.getItem('regsonar.theme'); } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121A1F');
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="RegSonar" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>RegSonar - APAC &amp; Global Regulatory Intelligence</title>
    <meta name="description" content="Regulatory notices from official public sources (US Federal Register for SEC and CFTC, HKMA, SFC, HKEX, MAS, ASIC, JFSA, Bank of England PRA, FCA, ESMA, BIS and FSB), with key points quoted from each document and the dates it states." />
    <meta property="og:title" content="RegSonar - APAC &amp; Global Regulatory Intelligence" />
    <meta property="og:description" content="Regulatory notices from official public sources (US Federal Register for SEC and CFTC, HKMA, SFC, HKEX, MAS, ASIC, JFSA, Bank of England PRA, FCA, ESMA, BIS and FSB), with key points quoted from each document and the dates it states." />
