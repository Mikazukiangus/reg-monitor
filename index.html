<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#802626" />
    <script>
      // Apply the saved or device theme before the page draws
      (function () {
        var choice = null;
        try { choice = localStorage.getItem('regsonar.theme'); } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>RegSonar - APAC &amp; Global Regulatory Intelligence</title>
