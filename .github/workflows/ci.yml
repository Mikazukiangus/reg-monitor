# Type-check, test and build on every push and pull request. The tests use
# responses saved in tests/fixtures, so nothing here contacts a regulator.
name: CI

on:
  push:
  pull_request:

# The jobs only read the repository
permissions:
  contents: read

# Each action is pinned to the exact commit of a release (named in the
# comment), so a moved or replaced tag cannot change what runs here.
# Dependabot proposes new pins (.github/dependabot.yml).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build

  # Known vulnerabilities rated high or critical in package.json's dependencies,
  # the packages the site runs on; devDependencies (the build, type-checking
  # and test tools) are left out. Read from the lockfile. A separate job, so
  # a new advisory shows as its own failure and never hides the test results.
  # Vercel deploys on its own, so this warns; it does not stop a deploy.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high --package-lock-only
